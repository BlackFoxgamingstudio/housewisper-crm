version: "3.9"
# Sovereign HouseWisper CRM — docker-compose
# Usage: docker-compose up --build

services:
  housewisper-crm:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-housewisper-crm:latest
    container_name: sovereign-housewisper-crm
    restart: unless-stopped
    ports:
      - "8807:8807"
    environment:
      SBB_MLS_API_KEY: ${SBB_MLS_API_KEY}
      SBB_CRM_WEBHOOK_SECRET: ${SBB_CRM_WEBHOOK_SECRET}
      SBB_VALUATION_MODEL: ${SBB_VALUATION_MODEL}
      SBB_CALENDAR_PROVIDER: ${SBB_CALENDAR_PROVIDER}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8807
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8807/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
