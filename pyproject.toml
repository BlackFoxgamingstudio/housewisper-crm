[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-housewisper-crm"
version = "1.0.0"
description = "Real estate CRM automation and buyer workflow assistant. Connects BoldTrail and Follow Up Boss APIs with Google Cloud Build, managing listing inquiry routing, automated client follow-ups, and transaction milestone tracking."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Russell Alan Powers", email = "russell@sovereignbizbox.io"}
]
keywords = ["sovereign", "real estate workflow automation", "microservice", "n8n", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries"
]
dependencies = []

[project.scripts]
sovereign-housewisper-crm = "src.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.8",
]
